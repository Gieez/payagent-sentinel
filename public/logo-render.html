<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PayAgent Sentinel Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Plus+Jakarta+Sans:wght@900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 512px;
      height: 512px;
      background: #06090e;
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(6, 182, 212, 0.22) 0%, transparent 65%),
        radial-gradient(circle at 80% 80%, rgba(0, 112, 186, 0.25) 0%, transparent 60%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px, 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
      overflow: hidden;
    }

    .outer-circle {
      width: 420px;
      height: 420px;
      border-radius: 50%;
      border: 1px solid rgba(6, 182, 212, 0.3);
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.12), inset 0 0 40px rgba(0, 112, 186, 0.15);
    }

    .orbital-dash {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.2);
    }

    .shield-container {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(7, 12, 22, 0.98));
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 36px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(6, 182, 212, 0.3),
        inset 0 0 25px rgba(0, 112, 186, 0.4);
    }

    .svg-shield {
      width: 140px;
      height: 140px;
      filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
    }

    .logo-text {
      margin-top: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 2px;
      z-index: 5;
    }
    .logo-text span {
      background: linear-gradient(90deg, #38bdf8, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-badge {
      margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(15, 23, 42, 0.8);
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid #1e293b;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="orbital-dash"></div>
  <div class="outer-circle"></div>

  <div class="shield-container">
    <svg class="svg-shield" viewBox="0 0 24 24" fill="none" stroke="url(#paint0_linear)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="paint0_linear" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
          <stop stop-color="#38BDF8"/>
          <stop offset="0.5" stop-color="#3B82F6"/>
          <stop offset="1" stop-color="#0070BA"/>
        </linearGradient>
      </defs>
      <!-- Shield Perimeter -->
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <!-- Inner Core Circuit / Node -->
      <circle cx="12" cy="11" r="3.2" fill="#06B6D4" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5"/>
      <path d="M12 7.8V5"/>
      <path d="M12 14.2V17"/>
      <path d="M8.8 11H6.5"/>
      <path d="M15.2 11H17.5"/>
      <path d="m9.7 8.7-1.6-1.6"/>
      <path d="m14.3 13.3 1.6 1.6"/>
    </svg>
  </div>

  <div class="logo-text">
    PAYAGENT<span>SENTINEL</span>
  </div>
  <div class="sub-badge">
    PAYPAL AI FIREWALL
  </div>

</body>
</html>
